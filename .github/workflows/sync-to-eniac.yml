name: Sync site to Penn eniac mirror

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add canonical tags pointing to michaelpignatelli.com
        run: python3 scripts/add_canonical.py

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ENIAC_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H eniac.seas.upenn.edu >> ~/.ssh/known_hosts

      - name: Rsync site to eniac public_html
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.idea' \
            --exclude '.DS_Store' \
            --exclude 'scripts' \
            --exclude 'README.md' \
            --exclude 'CNAME' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./ mpig@eniac.seas.upenn.edu:~/public_html/